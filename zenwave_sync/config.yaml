name: "ZenWave Sync"
version: "0.1.17"
slug: "zenwave_sync"
description: "Liest Verbrauch, Durchschnittspreis und variable Kosten aus dem ZenWave-Kundenportal (Zendure) aus, statt sie aus Shelly/Poweropti zu schaetzen"
url: "https://github.com/dumdidumger-commits/RB_dienstplan"
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: application
boot: auto
# Noetig fuer persistent_notification bei Fehlern (SUPERVISOR_TOKEN), gleiches Muster wie
# beim Nachbar-Add-on "Vivendi Dienstplan Sync".
homeassistant_api: true
options:
  zenwave_username: ""
  zenwave_password: ""
  zenwave_login_url: "https://zenwave.customerportal.energy/"
  # 12.08.2026 auf 23:59 umgestellt (Roland-Wunsch): gibt ZenWaves Backend fast den ganzen
  # Tag Zeit, die Intervalldaten zu verarbeiten, bevor wir abfragen - naeher am finalen Wert
  # als eine Abfrage kurz nach Mitternacht (7 Uhr hatte nur 7h Verarbeitungszeit seit
  # Tagesbeginn). Exakt 00:00 bewusst vermieden wegen moeglicher Mitternachts-Umschaltblase
  # im ZenWave-Backend selbst.
  run_time: "23:59"
  # 12.08.2026 neu (Roland-Wunsch): leichtgewichtiger Preis-Nur-Sync (nur Strompreis-Karte,
  # kein Verbrauch-Tab) laeuft zusaetzlich alle X Stunden - unabhaengig vom einmal-taeglichen
  # vollen Sync oben. Speichert echte Preis-Schnappschuesse mit Zeitstempel, damit Kosten der
  # Vergangenheit auf echten statt hochgerechneten Werten basieren koennen.
  price_sync_interval_hours: 5
  log_level: "info"
  # Bewusst standardmaessig AN (anders als beim inzwischen eingespielten Vivendi-Add-on) -
  # dieses Add-on ist noch in der Kennenlern-Phase, die ersten echten Laeufe brauchen die
  # Screenshots, um die Login-/Auslese-Selektoren nachzujustieren. Nach ein paar erfolgreichen
  # Laeufen auf false stellen.
  debug_screenshots: true
  # 12.08.2026: Kommagetrennte ISO-Daten ("2026-08-09,2026-08-10"), fuer die beim naechsten
  # Start gezielt die exakten, ueber den Kalender im Zeitraum-Dropdown ausgewaehlten Werte
  # nachgetragen werden sollen (z.B. um aeltere Tage zu verifizieren/korrigieren, siehe
  # project_zenwave_sync_planning Memory). Wird nach erfolgreicher Verarbeitung automatisch
  # wieder auf "" zurueckgesetzt, laeuft also nicht bei jedem Neustart erneut.
  backfill_dates: ""
schema:
  zenwave_username: str
  zenwave_password: password
  zenwave_login_url: url
  run_time: match(^([0-1][0-9]|2[0-3]):[0-5][0-9]$)
  price_sync_interval_hours: float(1,24)
  log_level: list(debug|info|warning|error)
  debug_screenshots: bool
  backfill_dates: str
map:
  - share:rw
