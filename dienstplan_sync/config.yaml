name: "Vivendi Dienstplan Sync"
version: "0.1.5"
slug: "dienstplan_sync"
description: "Synchronisiert den Vivendi-Dienstplan taeglich mit einem Google-Kalender"
url: "https://github.com/dumdidumger-commits/RB_dienstplan"
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: application
boot: auto
# Noetig, damit das SUPERVISOR_TOKEN Zugriff auf die Core-REST-API hat (persistent_notification
# bei Fehlern, siehe notify.py) - fehlte urspruenglich, fuehrte beim ersten echten Testlauf zu
# "401 Unauthorized" bei jedem Fehlerversuch (2026-07-30).
homeassistant_api: true
options:
  vivendi_username: ""
  vivendi_password: ""
  vivendi_login_url: "https://vivendiselfservice.johanniter.de:8755/areas/login/#/login"
  sync_months_ahead: 2
  run_time: "06:00"
  log_level: "info"
  debug_screenshots: false
  nabu_casa_base_url: "https://9socrjhuhu4fraznz7zna34u9zhznzrx.ui.nabu.casa"
  # 14.08.2026 NUR TEMPORAER fuer die Selektor-Erkundung des Tag-Klick-Detailfensters
  # (Vorstufe fuer die automatische Kuerzel-Aufloesung, siehe vivendi.probe_tag_klick()) -
  # ISO-Datum setzen, um einmalig beim naechsten Start probe_tag_klick() statt des normalen
  # Syncs laufen zu lassen. Wieder auf "" zurueckstellen (oder die Option ganz entfernen),
  # sobald die echte Feature-Implementierung steht.
  probe_date: ""
schema:
  vivendi_username: str
  vivendi_password: password
  vivendi_login_url: url
  sync_months_ahead: int(1,6)
  run_time: match(^([0-1][0-9]|2[0-3]):[0-5][0-9]$)
  log_level: list(debug|info|warning|error)
  debug_screenshots: bool
  nabu_casa_base_url: url
  probe_date: str
map:
  - share:rw
  # Noetig fuer die ICS-Kalender-URL (30.07.2026, zusaetzliche Absicherung neben der
  # Google-API-Synchronisation, falls der OAuth-Testzugang nach 7 Tagen ablaeuft): schreibt
  # eine .ics-Datei nach /homeassistant/www/, die ueber die bereits vorhandene, extern
  # erreichbare Nabu-Casa-Cloud-URL (.../local/...) unauthentifiziert abrufbar ist - Google
  # kann bei "Kalender von URL abonnieren" keine Zugangsdaten mitschicken, daher zwingend
  # ohne Login, abgesichert nur durch einen langen Zufallsnamen (siehe ics_export.py).
  - homeassistant_config:rw
